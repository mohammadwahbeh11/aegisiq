server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SPA fallback: every unknown path returns index.html so React Router
    # can render the deep link (e.g. a fresh reload on /alerts/42).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache built assets (Vite fingerprints them), never cache
    # index.html itself so a new deploy is picked up on next reload.
    location ~* \.(?:js|css|woff2?|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}
