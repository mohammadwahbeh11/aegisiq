# render.yaml — Blueprint deploy of AegisIQ to Render.com (free tier).
#
# Provisions two services:
#   * aegisiq-backend   -- FastAPI, built from backend/Dockerfile
#                          → https://aegisiq-backend.onrender.com
#   * aegisiq-frontend  -- Vite static site, built with the backend URL
#                          baked in as VITE_API_URL
#                          → https://aegisiq-frontend.onrender.com
#
# Deploy:
#   1. Push this repo to GitHub.
#   2. Render → New + → Blueprint → select the repo → Apply.
# Full walk-through: docs/DEPLOY_RENDER.md
#
# The service NAMES below determine the URLs. CORS_ORIGINS and VITE_API_URL
# are wired to those exact names — renaming one service means updating both.
#
# Free-tier behaviour, stated honestly:
#   * The backend spins down after ~15 min idle; the next request wakes it
#     in 30-60 s. The console's login page probes /health with back-off so
#     it recovers from that cold start instead of reporting the API down.
#   * The free tier has NO persistent disk, so the SQLite file lives in the
#     container's ephemeral filesystem and is rebuilt (default admin + the
#     8 seeded detection rules) on every restart or redeploy. That is fine
#     for a demo; for durable data create a Render PostgreSQL instance and
#     set DATABASE_URL to its connection string — psycopg is already in
#     requirements.txt, so no code change is needed. See docs/DEPLOY_RENDER.md.
#   * TLS and the *.onrender.com subdomain are automatic on both services,
#     which is also what makes the alert stream available over wss://.

services:
  # ── Backend: FastAPI (Docker) ─────────────────────────────────────────
  - type: web
    name: aegisiq-backend
    runtime: docker
    plan: free
    region: frankfurt          # closest EU region; change if you prefer
    # Context is the REPO ROOT, not ./backend: the image also needs
    # sigma_rules/, which lives at the root. See backend/Dockerfile.
    dockerContext: .
    dockerfilePath: ./backend/Dockerfile
    # No dockerCommand override. The Dockerfile's CMD is shell form and
    # already expands Render's injected $PORT (`--port ${PORT:-8000}`)
    # while binding 0.0.0.0. Overriding it here previously risked passing
    # a literal, unexpanded "$PORT" to uvicorn.
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Ephemeral on the free tier — see the note above.
      - key: DATABASE_URL
        value: sqlite:////app/data/siem.db
      # Generated by Render on first deploy, stored encrypted, and never
      # shown to any tool. Rotate any time from the Render dashboard.
      - key: SECRET_KEY
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
      # This is the console login password. It is generated, so read it
      # once from Render → aegisiq-backend → Environment, then change it
      # from inside the console after your first login.
      - key: DEFAULT_ADMIN_PASSWORD
        generateValue: true
      # ENV=production activates the startup guardrail in app/config.py:
      # the app refuses to boot with a demo SECRET_KEY, a demo admin
      # password, a missing DATA_ENCRYPTION_KEY, or wildcard CORS.
      - key: ENV
        value: production
      - key: SOAR_ENABLED
        value: "true"
      # Record containment actions, never execute them. This codebase has
      # no code path that runs a real firewall command.
      - key: SOAR_EXECUTE
        value: "false"
      # CORS is an explicit allow-list, not "*" — the API sends
      # Access-Control-Allow-Credentials, so a wildcard would be both
      # refused by browsers and rejected by the production guardrail.
      - key: CORS_ORIGINS
        value: https://aegisiq-frontend.onrender.com

  # ── Frontend: Vite build → static hosting ─────────────────────────────
  - type: web
    name: aegisiq-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --no-audit --no-fund && npm run build
    staticPublishPath: ./dist
    # SPA rewrite so a reload on /alerts/42 renders the route instead of 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    envVars:
      # Pin the toolchain: the build runs `tsc -b && vite build`, and
      # letting Render drift onto a different major Node release is a
      # classic way for a previously-green static build to start failing.
      - key: NODE_VERSION
        value: "20.18.0"
      # Build-time only — baked into the bundle, so it must never hold a
      # secret. streamUrl() in src/api/client.ts derives the WebSocket URL
      # from this value, upgrading https:// → wss:// automatically.
      - key: VITE_API_URL
        value: https://aegisiq-backend.onrender.com
